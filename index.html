<style>
:root{--navy:#102a43;--navy2:#173f5f;--green:#159a72;--blue:#e7f2fb;--bg:#f4f7fb;--ink:#203246;--muted:#718096;--line:#e1e8f0;--red:#c0392b;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:white}button.secondary{background:#e8eef5;color:var(--navy)}button.green{background:var(--green)}button.danger{background:#fff0ef;color:var(--red)}button.small{padding:6px 9px;font-size:12px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:bold;letter-spacing:.3px;padding:4px 6px 20px;min-width:0}.brand img{width:58px;height:58px;object-fit:contain;border-radius:10px;background:#fff;flex-shrink:0}.brand .brandtext{min-width:0}.brand small{display:block;font-size:11px;font-weight:normal;color:#c9d8e6;margin-top:6px;line-height:1.6}.nav{display:grid;gap:6px}.nav button{background:transparent;text-align:right;color:#d8e5ef;border-radius:10px;padding:12px}.nav button.active,.nav button:hover{background:#234965;color:white}.sidefoot{position:absolute;bottom:18px;right:18px;left:18px;font-size:11px;color:#a9bfd0;line-height:1.8}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{margin:0;font-size:22px;color:var(--navy)}.top p{margin:6px 0 0;color:var(--muted);font-size:12px}.content{padding:24px;max-width:1600px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input,.toolbar select{max-width:220px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #102a4308}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:24px;font-weight:bold;color:var(--navy);margin-top:10px;overflow-wrap:anywhere}.stat .hint{font-size:11px;color:var(--muted);margin-top:6px}.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px}.panel h3{margin:0 0 14px;font-size:15px;color:var(--navy)}.barrow{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;margin:12px 0;font-size:12px}.barbg{height:10px;background:#edf2f7;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--green);border-radius:20px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:right;padding:12px 13px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}th{background:#f7f9fc;color:#526579;font-weight:bold;white-space:nowrap}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:35px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#edf2f7;color:#475569;font-size:11px;white-space:nowrap}.badge.green{background:#e5f7ef;color:#087f5b}.badge.red{background:#fff0ef;color:#b42318}.badge.amber{background:#fff7df;color:#946200}.actions{display:flex;gap:5px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#526579}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #d6e0ea;border-radius:8px;padding:10px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:76px;resize:vertical}.modalback{position:fixed;inset:0;background:#0b1f33a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalback.show{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:22px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modalhead h2{font-size:19px;margin:0;color:var(--navy)}.modalfoot{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}.notice{padding:12px 14px;border-radius:10px;background:#eaf4fb;color:#234965;font-size:12px;line-height:1.8;margin-bottom:15px}.dangertext{color:var(--red)}.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayhead,.day{padding:9px 5px;text-align:center;font-size:12px}.dayhead{color:var(--muted);font-weight:bold}.day{background:white;border:1px solid var(--line);border-radius:8px;min-height:76px;text-align:right}.day .dnum{font-weight:bold}.day .event{font-size:10px;display:block;margin-top:6px;padding:4px;border-radius:5px;background:#e5f7ef;color:#087f5b;overflow:hidden}.day .event.late{background:#fff0ef;color:#b42318}.hidden{display:none!important}.footer-note{font-size:11px;color:var(--muted);line-height:1.8;margin-top:16px}.filelabel{display:inline-block;background:#e8eef5;color:var(--navy);padding:10px 14px;border-radius:9px;cursor:pointer;font-size:13px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:10px 12px;z-index:2}.brand{padding:3px 5px 10px}.brand img{width:48px;height:48px}.nav{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding-bottom:3px}.nav button{white-space:nowrap;padding:10px}.sidefoot{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.content{padding:15px}.top{padding:15px}.top h1{font-size:19px}}
@media(max-width:560px){.top{align-items:flex-start;gap:10px}.top>div:first-child{width:100%}.top .toolbar{width:100%;display:flex}.top .toolbar button{flex:1;padding:9px 7px;font-size:12px}.content{padding:10px}.brand{font-size:17px}.brand img{width:44px;height:44px}.stats{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat .num{font-size:19px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.barrow{grid-template-columns:70px 1fr 62px;gap:6px}.panel,.stat{border-radius:11px}.panel{padding:13px}.modalback{padding:8px;align-items:flex-end}.modal{max-height:92dvh;border-radius:16px 16px 0 0;padding:16px}.monthgrid{gap:3px}.day{min-height:58px;padding:5px 3px}.dayhead,.day{font-size:10px}.day .event{font-size:9px;padding:3px}.tablewrap{max-width:calc(100vw - 20px)}button{min-height:40px}}
@media print{.side,.top .toolbar,.toolbar,.actions,.no-print,button,.filelabel{display:none!important}.app{display:block}.content{padding:0}.panel,.stat,.tablewrap{box-shadow:none;break-inside:avoid}.main{width:100%}body{background:white}.tablewrap{overflow:visible}table{min-width:0}th,td{font-size:10px;padding:7px}}

.social-links{display:grid;gap:8px;margin-top:14px;padding:12px;background:#ffffff10;border:1px solid #ffffff20;border-radius:12px}
.social-title{font-size:12px;font-weight:bold;color:#fff;margin-bottom:2px}
.social-link{display:flex;align-items:center;gap:9px;text-decoration:none;color:#eaf3fa;background:#ffffff0b;border-radius:9px;padding:9px 10px;font-size:12px;min-width:0}
.social-link:hover{background:#ffffff1c}.social-link .socicon{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:8px;background:#fff;color:#173f5f;flex-shrink:0;font-weight:bold;font-size:15px}.social-link .socname{min-width:0;overflow-wrap:anywhere}.social-link .socmeta{display:block;font-size:10px;color:#b8cbd9;margin-top:2px}
@media(max-width:1000px){.social-links{grid-template-columns:repeat(3,minmax(0,1fr));margin:8px 0 0;padding:7px;gap:6px}.social-title{grid-column:1/-1}.social-link{padding:7px 6px;justify-content:center;flex-wrap:wrap;text-align:center;gap:5px}.social-link .socicon{width:24px;height:24px}.social-link .socmeta{font-size:9px}}
@media(max-width:560px){.social-links{grid-template-columns:repeat(3,minmax(0,1fr));}.social-link{font-size:10px;flex-direction:column}.social-link .socmeta{font-size:9px}}

<script>
const KEY='spss_sba_v1';
const defaultServices=[
{id:'S01',name:'التحليل الإحصائي باستخدام SPSS',category:'إحصاء',price:0,description:'',active:true},
{id:'S02',name:'كتابة وإعداد مذكرات التخرج',category:'كتابة أكاديمية',price:0,description:'',active:true},
{id:'S03',name:'إعداد التقارير وتقارير التربص',category:'كتابة أكاديمية',price:0,description:'',active:true},
{id:'S04',name:'تصميم السيرة الذاتية CV',category:'تصميم',price:0,description:'',active:true},
{id:'S05',name:'تصميم عروض PowerPoint',category:'تصميم',price:0,description:'',active:true},
{id:'S06',name:'التسجيلات والخدمات المرتبطة بها',category:'خدمات متنوعة',price:0,description:'حدد التفاصيل عند الطلب',active:true},
{id:'S07',name:'تنسيق المذكرات والوثائق',category:'تنسيق',price:0,description:'',active:true},
{id:'S08',name:'خدمات أخرى',category:'أخرى',price:0,description:'',active:true}
];
const seed={version:1,customers:[],orders:[],payments:[],expenses:[],services:defaultServices,settings:{currency:'DZD'},audit:[]};
let db=loadDB(),page='dashboard',editing=null;
function loadDB(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&d.version?d:structuredClone(seed)}catch(e){return structuredClone(seed)}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));}
function uid(prefix){return prefix+'-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase()}
function today(){return new Date().toISOString().slice(0,10)}
function money(n){return new Intl.NumberFormat('ar-DZ',{maximumFractionDigits:2}).format(Number(n)||0)+' دج'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateFmt(s){return s?new Date(s+'T12:00:00').toLocaleDateString('ar-DZ'):'—'}
function customer(id){return db.customers.find(x=>x.id===id)}
function service(id){return db.services.find(x=>x.id===id)}
function order(id){return db.orders.find(x=>x.id===id)}
function paid(id){return db.payments.filter(x=>x.orderId===id&&x.kind!=='refund').reduce((a,x)=>a+Number(x.amount||0),0)-db.payments.filter(x=>x.orderId===id&&x.kind==='refund').reduce((a,x)=>a+Number(x.amount||0),0)}
function total(o){return Math.max(0,Number(o.price||0)-Number(o.discount||0))}
function due(o){return total(o)-paid(o.id)}
function isLate(o){return o.dueDate&&o.dueDate<today()&&!['مكتمل','مسلّم','ملغى'].includes(o.status)}
function log(action,entity,id,detail=''){db.audit.unshift({id:uid('LOG'),at:new Date().toISOString(),action,entity,id,detail});db.audit=db.audit.slice(0,1000)}
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
const titles={dashboard:['لوحة التحكم','نظرة سريعة على نشاط SPSS SBA'],orders:['إدارة الطلبات','تسجيل الطلبات ومتابعة الإنجاز والمستحقات'],customers:['إدارة العملاء','بيانات العملاء وسجل تعاملاتهم'],payments:['المدفوعات','تسجيل الدفعات والاسترجاعات ومراجعة المقبوضات'],expenses:['المصاريف','متابعة مصاريف النشاط حسب التاريخ والتصنيف'],services:['الخدمات','إدارة قائمة الخدمات وأسعارها التقديرية'],calendar:['تقويم التسليم','مواعيد التسليم والطلبات المتأخرة'],reports:['التقارير','ملخص مالي وإداري حسب الفترة'],backup:['البيانات والنسخ الاحتياطي','تصدير نسخة احتياطية واستعادتها']};
function render(){document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('pageSub').textContent=titles[page][1];let v=document.getElementById('view');v.innerHTML=({dashboard:dashboardView,orders:ordersView,customers:customersView,payments:paymentsView,expenses:expensesView,services:servicesView,calendar:calendarView,reports:reportsView,backup:backupView})[page]();bindFilters()}
function stat(label,value,hint=''){return `<div class="stat"><div class="label">${label}</div><div class="num">${value}</div><div class="hint">${hint}</div></div>`}
function dashboardView(){let m=new Date().toISOString().slice(0,7),monthPays=db.payments.filter(p=>p.date?.startsWith(m)&&p.kind!=='refund').reduce((a,p)=>a+ +p.amount,0)-db.payments.filter(p=>p.date?.startsWith(m)&&p.kind==='refund').reduce((a,p)=>a+ +p.amount,0),monthExp=db.expenses.filter(x=>x.date?.startsWith(m)).reduce((a,x)=>a+ +x.amount,0),active=db.orders.filter(o=>!['مكتمل','مسلّم','ملغى'].includes(o.status));
let vals=db.services.map(s=>({name:s.name,value:db.orders.filter(o=>o.serviceId===s.id).reduce((a,o)=>a+total(o),0)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,5),max=Math.max(1,...vals.map(x=>x.value));
return `<div class="stats">${stat('عدد العملاء',db.customers.length,'إجمالي العملاء المسجلين')}${stat('الطلبات النشطة',active.length,'لا تشمل المكتملة والملغاة')}${stat('الطلبات المتأخرة',db.orders.filter(isLate).length,'تجاوزت موعد التسليم')}${stat('المستحقات الحالية',money(db.orders.filter(o=>o.status!=='ملغى').reduce((a,o)=>a+Math.max(0,due(o)),0)),'بعد احتساب الدفعات والاسترجاعات')}</div>
<div class="stats">${stat('قيمة الطلبات',money(db.orders.filter(o=>o.status!=='ملغى').reduce((a,o)=>a+total(o),0)),'بعد الخصومات، لا تعني المقبوضات')}${stat('المقبوضات هذا الشهر',money(monthPays),'حسب تاريخ تسجيل الدفعة')}${stat('المصاريف هذا الشهر',money(monthExp),'حسب تاريخ المصروف')}${stat('صافي التدفق النقدي هذا الشهر',money(monthPays-monthExp),'المقبوضات ناقص المصاريف المسجلة')}</div>
<div class="grid2"><div class="panel"><h3>أعلى الخدمات من حيث قيمة الطلبات</h3>${vals.length?vals.map(x=>`<div class="barrow"><span>${esc(x.name)}</span><div class="barbg"><div class="bar" style="width:${x.value/max*100}%"></div></div><b>${money(x.value)}</b></div>`).join(''):'<div class="empty">ستظهر الإحصائيات بعد تسجيل الطلبات</div>'}</div><div class="panel"><h3>أقرب مواعيد التسليم</h3>${db.orders.filter(o=>o.dueDate&&!['مسلّم','ملغى'].includes(o.status)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,6).map(o=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px"><span><b>${esc(o.id)}</b> · ${esc(customer(o.customerId)?.name||'عميل محذوف')}<br><small style="color:var(--muted)">${esc(o.title)}</small></span><span class="badge ${isLate(o)?'red':'amber'}">${dateFmt(o.dueDate)}</span></div>`).join('')||'<div class="empty">لا توجد مواعيد مسجلة</div>'}</div></div>
<div class="panel"><h3>آخر الطلبات</h3>${orderTable(db.orders.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,8),false)}</div><p class="footer-note">المؤشرات المالية نقدية ومبسطة. صافي التدفق النقدي = المقبوضات المسجلة − المصاريف المسجلة، وليس بالضرورة صافي الربح المحاسبي.</p>`}
function orderTable(list,actions=true){if(!list.length)return '<div class="empty">لا توجد بيانات لعرضها.</div>';return `<div class="tablewrap"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الخدمة / العنوان</th><th>التسليم المتوقع</th><th>الحالة</th><th>القيمة النهائية</th><th>المحصّل</th><th>المتبقي</th>${actions?'<th>إجراءات</th>':''}</tr></thead><tbody>${list.map(o=>`<tr><td><b>${esc(o.id)}</b></td><td>${esc(customer(o.customerId)?.name||'—')}</td><td>${esc(service(o.serviceId)?.name||'خدمة غير محددة')}<br><small>${esc(o.title||'')}</small></td><td>${dateFmt(o.dueDate)} ${isLate(o)?'<span class="badge red">متأخر</span>':''}</td><td>${statusBadge(o.status)}</td><td>${money(total(o))}</td><td>${money(paid(o.id))}</td><td class="${due(o)>0?'dangertext':''}">${money(due(o))}</td>${actions?`<td><div class="actions"><button class="small secondary" onclick="openOrder('${o.id}')">تعديل</button><button class="small green" onclick="openPayment('${o.id}')">＋ دفعة</button><button class="small danger" onclick="deleteRecord('orders','${o.id}')">حذف</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function statusBadge(s){let c=['مكتمل','مسلّم'].includes(s)?'green':s==='ملغى'?'red':['قيد الإنجاز','بانتظار المراجعة'].includes(s)?'amber':'';return `<span class="badge ${c}">${esc(s||'جديد')}</span>`}
function ordersView(){return `<div class="toolbar"><input id="orderSearch" placeholder="بحث برقم الطلب أو العميل أو الهاتف أو العنوان"><select id="orderStatus"><option value="">كل الحالات</option>${['جديد','قيد الإنجاز','في انتظار معلومات العميل','بانتظار المراجعة','مكتمل','مسلّم','ملغى'].map(s=>`<option>${s}</option>`).join('')}</select><select id="orderService"><option value="">كل الخدمات</option>${db.services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label class="filelabel"><input type="checkbox" id="lateOnly" style="width:auto"> المتأخرة فقط</label><button class="green" onclick="openOrder()">＋ طلب جديد</button><button class="secondary" onclick="exportCSV('orders')">تصدير CSV</button></div><div id="ordersTable">${orderTable(db.orders.slice().sort((a,b)=>b.created.localeCompare(a.created)))}</div>`}
function customersView(){return `<div class="toolbar"><input id="customerSearch" placeholder="بحث بالاسم أو الهاتف أو التخصص"><button class="green" onclick="openCustomer()">＋ عميل جديد</button><button class="secondary" onclick="exportCSV('customers')">تصدير CSV</button></div><div id="customersTable">${customerTable(db.customers)}</div>`}
function customerTable(list){if(!list.length)return '<div class="empty">لا يوجد عملاء بعد. أضف أول عميل للبدء.</div>';return `<div class="tablewrap"><table><thead><tr><th>المعرف</th><th>الاسم</th><th>الهاتف</th><th>التخصص / المؤسسة</th><th>تاريخ أول تعامل</th><th>الطلبات</th><th>المتبقي</th><th>إجراءات</th></tr></thead><tbody>${list.map(c=>{let os=db.orders.filter(o=>o.customerId===c.id),d=os.filter(o=>o.status!=='ملغى').reduce((a,o)=>a+Math.max(0,due(o)),0);return `<tr><td>${esc(c.id)}</td><td><b>${esc(c.name)}</b><br><small>${esc(c.social||'')}</small></td><td>${esc(c.phone||'—')}</td><td>${esc(c.major||'—')}<br><small>${esc(c.institution||'')}</small></td><td>${dateFmt(c.firstDate)}</td><td>${os.length}</td><td class="${d>0?'dangertext':''}">${money(d)}</td><td><div class="actions"><button class="small secondary" onclick="openCustomer('${c.id}')">تعديل</button><button class="small secondary" onclick="customerStatement('${c.id}')">كشف حساب</button><button class="small danger" onclick="deleteRecord('customers','${c.id}')">حذف</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function paymentsView(){return `<div class="toolbar"><input id="paymentSearch" placeholder="بحث برقم العملية أو الطلب أو العميل"><button class="green" onclick="openPayment()">＋ تسجيل دفعة</button><button class="secondary" onclick="exportCSV('payments')">تصدير CSV</button><button class="secondary" onclick="window.print()">طباعة</button></div><div class="stats">${stat('إجمالي الدفعات',money(db.payments.filter(p=>p.kind!=='refund').reduce((a,p)=>a+ +p.amount,0)),'قبل خصم الاسترجاعات')}${stat('الاسترجاعات',money(db.payments.filter(p=>p.kind==='refund').reduce((a,p)=>a+ +p.amount,0)),'مبالغ معادة للعملاء')}${stat('صافي المقبوضات',money(db.payments.reduce((a,p)=>a+(p.kind==='refund'?-1:1)* +p.amount,0)),'بعد الاسترجاعات')}${stat('عدد العمليات',db.payments.length,'دفعات واسترجاعات')}</div><div id="paymentsTable">${paymentTable(db.payments)}</div>`}
function paymentTable(list){if(!list.length)return '<div class="empty">لا توجد عمليات دفع مسجلة.</div>';return `<div class="tablewrap"><table><thead><tr><th>رقم العملية</th><th>التاريخ</th><th>الطلب / العميل</th><th>النوع</th><th>المبلغ</th><th>طريقة الدفع</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody>${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${esc(p.id)}</td><td>${dateFmt(p.date)}</td><td>${esc(p.orderId)}<br>${esc(customer(order(p.orderId)?.customerId)?.name||'—')}</td><td>${p.kind==='refund'?'<span class="badge red">استرجاع</span>':'<span class="badge green">دفعة</span>'}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.notes||'')}</td><td><button class="small danger" onclick="deleteRecord('payments','${p.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function expensesView(){return `<div class="toolbar"><input id="expenseSearch" placeholder="بحث في الوصف أو التصنيف"><input id="expenseMonth" type="month"><button class="green" onclick="openExpense()">＋ مصروف جديد</button><button class="secondary" onclick="exportCSV('expenses')">تصدير CSV</button></div><div class="stats">${stat('إجمالي المصاريف',money(db.expenses.reduce((a,e)=>a+ +e.amount,0)),'جميع السجلات')}${stat('عدد المصاريف',db.expenses.length,'عملية مصروف')}</div><div id="expensesTable">${expenseTable(db.expenses)}</div>`}
function expenseTable(list){if(!list.length)return '<div class="empty">لا توجد مصاريف مسجلة.</div>';return `<div class="tablewrap"><table><thead><tr><th>المعرف</th><th>التاريخ</th><th>التصنيف</th><th>الوصف</th><th>المبلغ</th><th>طريقة الدفع</th><th>إجراءات</th></tr></thead><tbody>${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${esc(e.id)}</td><td>${dateFmt(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td>${esc(e.method)}</td><td><div class="actions"><button class="small secondary" onclick="openExpense('${e.id}')">تعديل</button><button class="small danger" onclick="deleteRecord('expenses','${e.id}')">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`}
function servicesView(){return `<div class="toolbar"><button class="green" onclick="openService()">＋ إضافة خدمة</button><button class="secondary" onclick="exportCSV('services')">تصدير CSV</button></div><div class="notice">السعر التقديري اختياري. تعديل الخدمة لا يغيّر تلقائيًا الأسعار المتفق عليها في الطلبات السابقة.</div><div class="tablewrap"><table><thead><tr><th>المعرف</th><th>اسم الخدمة</th><th>التصنيف</th><th>السعر التقديري</th><th>الحالة</th><th>الوصف</th><th>إجراءات</th></tr></thead><tbody>${db.services.map(s=>`<tr><td>${esc(s.id)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.category)}</td><td>${money(s.price)}</td><td>${s.active?'<span class="badge green">مفعّلة</span>':'<span class="badge">معطّلة</span>'}</td><td>${esc(s.description||'')}</td><td><div class="actions"><button class="small secondary" onclick="openService('${s.id}')">تعديل</button><button class="small ${s.active?'danger':'green'}" onclick="toggleService('${s.id}')">${s.active?'تعطيل':'تفعيل'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function calendarView(){let now=new Date(),month=calendarMonth||now.toISOString().slice(0,7),[y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),offset=(first.getDay()+1)%7;let cells=Array.from({length:offset},()=>'<div></div>');for(let d=1;d<=days;d++){let ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,os=db.orders.filter(o=>o.dueDate===ds);cells.push(`<div class="day"><span class="dnum">${d}</span>${os.map(o=>`<span class="event ${isLate(o)?'late':''}" title="${esc(o.title)}" onclick="openOrder('${o.id}')" style="cursor:pointer">${esc(o.id)} · ${esc(customer(o.customerId)?.name||'')}</span>`).join('')}</div>`)}return `<div class="toolbar"><input type="month" id="calendarMonth" value="${month}"><button class="secondary" onclick="calendarMonth=new Date().toISOString().slice(0,7);render()">هذا الشهر</button></div><div class="panel"><div class="monthgrid">${['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${cells.join('')}</div></div><div class="footer-note">اضغط على بطاقة الطلب داخل اليوم لفتح بياناته وتعديلها. الطلبات المكتملة قد تظهر في التقويم ما دام لها موعد تسليم.</div>`}
let calendarMonth='';
function reportsView(){let year=new Date().getFullYear(),month=new Date().toISOString().slice(0,7);return `<div class="toolbar"><label>من <input id="reportFrom" type="date" value="${year}-01-01"></label><label>إلى <input id="reportTo" type="date" value="${today()}"></label><select id="reportService"><option value="">كل الخدمات</option>${db.services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="green" onclick="runReport()">تحديث التقرير</button><button class="secondary" onclick="window.print()">طباعة / PDF</button><button class="secondary" onclick="exportReportCSV()">تصدير CSV</button></div><div id="reportResult">${reportMarkup(''+year+'-01-01',today(),'')}</div><div class="footer-note">تعتمد المقبوضات والمصاريف على تاريخ تسجيل كل حركة، بينما تعتمد قيمة الطلبات على تاريخ تسجيل الطلب. المستحقات هي الأرصدة الحالية للطلبات غير الملغاة حتى وقت فتح التقرير.</div>`}
function reportMarkup(from,to,sid){let os=db.orders.filter(o=>o.created?.slice(0,10)>=from&&o.created?.slice(0,10)<=to&&(!sid||o.serviceId===sid)),ps=db.payments.filter(p=>p.date>=from&&p.date<=to&&(!sid||!p.orderId||order(p.orderId)?.serviceId===sid)),es=db.expenses.filter(e=>e.date>=from&&e.date<=to),gross=os.filter(o=>o.status!=='ملغى').reduce((a,o)=>a+total(o),0),receipts=ps.reduce((a,p)=>a+(p.kind==='refund'?-1:1)* +p.amount,0),cost=es.reduce((a,e)=>a+ +e.amount,0),outstanding=db.orders.filter(o=>o.status!=='ملغى'&&(!sid||o.serviceId===sid)).reduce((a,o)=>a+Math.max(0,due(o)),0);return `<div class="stats">${stat('عدد الطلبات',os.length,'حسب تاريخ التسجيل')}${stat('قيمة الطلبات',money(gross),'بعد الخصومات، دون الملغاة')}${stat('صافي المقبوضات',money(receipts),'الدفعات ناقص الاسترجاعات')}${stat('المصاريف',money(cost),'حسب تاريخ المصروف')}</div><div class="stats">${stat('صافي التدفق النقدي',money(receipts-cost),'المقبوضات ناقص المصاريف')}${stat('المستحقات الحالية',money(outstanding),'رصيد حالي وليس مستحقات تاريخية')}${stat('الطلبات المكتملة',os.filter(o=>['مكتمل','مسلّم'].includes(o.status)).length,'ضمن الفترة')}${stat('الطلبات المتأخرة حاليًا',db.orders.filter(isLate).length,'كل الطلبات')}</div><div class="grid2"><div class="panel"><h3>المقبوضات حسب الخدمة خلال الفترة</h3>${db.services.map(s=>{let n=ps.filter(p=>order(p.orderId)?.serviceId===s.id).reduce((a,p)=>a+(p.kind==='refund'?-1:1)* +p.amount,0);return n?`<div class="barrow"><span>${esc(s.name)}</span><div class="barbg"><div class="bar" style="width:${Math.max(0,n/Math.max(1,...db.services.map(s2=>Math.abs(ps.filter(p=>order(p.orderId)?.serviceId===s2.id).reduce((a,p)=>a+(p.kind==='refund'?-1:1)* +p.amount,0))))*100)}%"></div></div><b>${money(n)}</b></div>`:''}).join('')||'<div class="empty">لا توجد مقبوضات للخدمات في الفترة</div>'}</div><div class="panel"><h3>حالة الطلبات المسجلة في الفترة</h3>${['جديد','قيد الإنجاز','في انتظار معلومات العميل','بانتظار المراجعة','مكتمل','مسلّم','ملغى'].map(s=>{let n=os.filter(o=>o.status===s).length;return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px">${statusBadge(s)}<b>${n}</b></div>`}).join('')}</div></div><h3>الطلبات ضمن الفترة</h3>${orderTable(os,false)}`}
function runReport(){document.getElementById('reportResult').innerHTML=reportMarkup(document.getElementById('reportFrom').value,document.getElementById('reportTo').value,document.getElementById('reportService').value)}
function backupView(){return `<div class="grid2"><div class="panel"><h3>نسخة احتياطية كاملة</h3><p style="font-size:13px;line-height:1.9;color:var(--muted)">صدّر جميع العملاء والطلبات والمدفوعات والمصاريف والخدمات وسجل التعديلات في ملف JSON. احتفظ بالملف في مكان آمن خارج هذا المتصفح.</p><button class="green" onclick="backupJSON()">تنزيل نسخة احتياطية JSON</button><div style="margin-top:15px"><label class="filelabel">استعادة نسخة JSON <input type="file" accept=".json,application/json" onchange="restoreJSON(event)" hidden></label></div></div><div class="panel"><h3>تصدير البيانات</h3><p style="font-size:13px;line-height:1.9;color:var(--muted)">يمكن تنزيل كل قسم بصيغة CSV وفتحه في Excel. ولحفظ نسخة كاملة قابلة للاستعادة استخدم JSON.</p><div class="toolbar"><button class="secondary" onclick="exportCSV('customers')">العملاء CSV</button><button class="secondary" onclick="exportCSV('orders')">الطلبات CSV</button><button class="secondary" onclick="exportCSV('payments')">المدفوعات CSV</button><button class="secondary" onclick="exportCSV('expenses')">المصاريف CSV</button></div><button class="secondary" onclick="window.print()">طباعة الصفحة / حفظ PDF</button></div></div><div class="panel"><h3>إدارة البيانات التجريبية</h3><div class="notice">التطبيق يبدأ ببيانات فارغة. لا توجد بيانات تجريبية مختلطة ببياناتك الحقيقية.</div><button class="danger" onclick="if(confirm('سيتم حذف جميع العملاء والطلبات والمدفوعات والمصاريف والخدمات المضافة وإعادة الخدمات الافتراضية. نزّل نسخة احتياطية أولًا. هل تريد المتابعة؟')){db=structuredClone(seed);saveDB();render()}">إعادة ضبط التطبيق وحذف جميع البيانات</button></div><div class="panel" style="margin-top:16px"><h3>حدود النسخة الحالية</h3><ul style="font-size:13px;line-height:2;color:var(--muted)"><li>تُحفظ البيانات محليًا داخل المتصفح والجهاز الحالي باستخدام localStorage.</li><li>لا توجد مزامنة بين الأجهزة أو حسابات مستخدمين أو استضافة سحابية في هذه النسخة.</li><li>مسح بيانات المتصفح أو فقدان الجهاز قد يؤدي إلى فقد البيانات؛ النسخ الاحتياطي مسؤوليتك.</li><li>هذه أداة إدارية وليست برنامج محاسبة معتمدًا؛ راجع المعالجة المالية حسب احتياجاتك.</li></ul></div>`}
function field(label,name,value='',type='text',opts=null,required=false,full=false){let ctrl=opts?`<select name="${name}" ${required?'required':''}>${opts.map(o=>typeof o==='string'?`<option ${o===value?'selected':''}>${esc(o)}</option>`:`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}>`;return `<div class="field ${full?'full':''}"><label>${label}${required?' *':''}</label>${ctrl}</div>`}
function showModal(title,body,submitLabel,submitFn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=`<button class="green" id="saveModal">${submitLabel||'حفظ'}</button><button class="secondary" onclick="closeModal()">إلغاء</button>`;document.getElementById('modalback').classList.add('show');document.getElementById('saveModal').onclick=()=>{let f=document.querySelector('#modalBody form');if(f&&!f.reportValidity())return;submitFn(f?Object.fromEntries(new FormData(f).entries()):{});}}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function openCustomer(id=''){let c=id?customer(id):{name:'',phone:'',social:'',major:'',institution:'',firstDate:today(),source:'',notes:''};showModal(id?'تعديل بيانات العميل':'إضافة عميل جديد',`<form id="f" class="formgrid">${field('الاسم الكامل','name',c.name,'text',null,true)}${field('رقم الهاتف','phone',c.phone)}${field('Facebook / Instagram','social',c.social)}${field('التخصص الجامعي','major',c.major)}${field('الجامعة أو المؤسسة','institution',c.institution)}${field('تاريخ أول تعامل','firstDate',c.firstDate,'date')}${field('مصدر العميل','source',c.source,'text',['','Facebook','Instagram','إحالة','عميل سابق','أخرى'])}${field('ملاحظات','notes',c.notes,'textarea',null,false,true)}</form>`,'حفظ العميل',v=>{if(!v.name.trim())return alert('يرجى إدخال اسم العميل');if(v.phone&&db.customers.some(x=>x.id!==id&&x.phone.trim()===v.phone.trim()))if(!confirm('يوجد عميل آخر برقم الهاتف نفسه. هل تريد المتابعة؟'))return;if(id)Object.assign(c,v,{updated:new Date().toISOString()});else{c={...v,id:uid('CUS'),created:new Date().toISOString()};db.customers.push(c)}log(id?'تعديل':'إضافة','عميل',c.id);saveDB();closeModal();render()})}
function openOrder(id=''){let o=id?order(id):{customerId:'',serviceId:'',title:'',created:today(),startDate:today(),dueDate:'',deliveredDate:'',price:'',discount:0,status:'جديد',priority:'عادي',notes:''};let customers=db.customers.map(c=>({value:c.id,label:c.name+(c.phone?' · '+c.phone:'')}));let svcs=db.services.filter(s=>s.active).map(s=>({value:s.id,label:s.name}));if(!customers.length)return alert('أضف عميلًا أولًا قبل تسجيل الطلب.');if(!svcs.length)return alert('فعّل خدمة واحدة على الأقل.');showModal(id?'تعديل الطلب':'تسجيل طلب جديد',`<form id="f" class="formgrid">${field('العميل','customerId',o.customerId,'text',customers,true)}${field('نوع الخدمة','serviceId',o.serviceId,'text',svcs,true)}${field('عنوان مختصر / وصف الخدمة','title',o.title,'text',null,true,true)}${field('تاريخ تسجيل الطلب','created',o.created,'date',null,true)}${field('تاريخ بدء العمل','startDate',o.startDate,'date')}${field('موعد التسليم المتوقع','dueDate',o.dueDate,'date')}${field('تاريخ التسليم الفعلي','deliveredDate',o.deliveredDate,'date')}${field('السعر المتفق عليه (دج)','price',o.price,'number',null,true)}${field('الخصم (دج)','discount',o.discount,'number')}${field('الحالة','status',o.status,'text',['جديد','قيد الإنجاز','في انتظار معلومات العميل','بانتظار المراجعة','مكتمل','مسلّم','ملغى'])}${field('الأولوية','priority',o.priority,'text',['منخفضة','عادي','مرتفعة','عاجلة'])}${field('ملاحظات داخلية','notes',o.notes,'textarea',null,false,true)}</form><div class="notice">المتبقي يُحسب من السعر بعد الخصم ناقص الدفعات الصافية. لا تُدخل المبلغ المدفوع هنا؛ سجّل كل دفعة من قسم المدفوعات.</div>`,'حفظ الطلب',v=>{let price=Number(v.price),discount=Number(v.discount||0);if(price<0||discount<0||discount>price)return alert('تحقق من السعر والخصم: يجب ألا يتجاوز الخصم السعر.');let data={...v,price,discount};if(id){let oldStatus=o.status;Object.assign(o,data,{updated:new Date().toISOString()});if(oldStatus!==o.status)log('تغيير حالة من '+oldStatus+' إلى '+o.status,'طلب',o.id);log('تعديل','طلب',o.id)}else{data.id=uid('ORD');data.createdAt=new Date().toISOString();db.orders.push(data);log('إنشاء','طلب',data.id)}saveDB();closeModal();render()})}
function openPayment(orderId=''){let p={orderId:orderId||'',amount:'',date:today(),method:'نقدًا',notes:'',kind:'payment'};let opts=db.orders.filter(o=>o.status!=='ملغى').map(o=>({value:o.id,label:o.id+' · '+(customer(o.customerId)?.name||'')+' · المتبقي '+money(Math.max(0,due(o)))}));if(!opts.length)return alert('لا توجد طلبات صالحة لربط دفعة بها.');showModal('تسجيل حركة مالية',`<form id="f" class="formgrid">${field('الطلب','orderId',p.orderId,'text',opts,true)}${field('نوع العملية','kind','payment','text',[{value:'payment',label:'دفعة مستلمة'},{value:'refund',label:'مبلغ مسترجع'}],true)}${field('المبلغ (دج)','amount','','number',null,true)}${field('تاريخ العملية','date',p.date,'date',null,true)}${field('طريقة الدفع','method',p.method,'text',['نقدًا','تحويل بنكي','بريدي موب','CCP','أخرى'])}${field('ملاحظات','notes',p.notes,'textarea',null,false,true)}</form><div class="notice">تُحفظ كل حركة كسجل مستقل. لا تسجل استرجاعًا إلا إذا تم رد المبلغ فعليًا. سيتم تنبيهك إذا تجاوزت الدفعة الرصيد المتبقي.</div>`,'حفظ العملية',v=>{let amount=Number(v.amount),o=order(v.orderId);if(!o||amount<=0)return alert('اختر طلبًا وأدخل مبلغًا أكبر من صفر.');if(v.kind==='payment'&&amount>Math.max(0,due(o))&&!confirm('المبلغ أكبر من المتبقي الحالي ('+money(Math.max(0,due(o)))+'). هل تريد تسجيل دفعة زائدة؟'))return;if(v.kind==='refund'&&amount>Math.max(0,paid(o.id))&&!confirm('المبلغ المسترجع أكبر من صافي ما تم تحصيله للطلب. هل تريد المتابعة؟'))return;let dup=db.payments.some(x=>x.orderId===v.orderId&&x.amount==amount&&x.date===v.date&&x.method===v.method&&x.kind===v.kind);if(dup&&!confirm('توجد عملية مطابقة في الطلب والمبلغ والتاريخ والطريقة. هل تريد تسجيلها رغم احتمال التكرار؟'))return;let rec={...v,amount,id:uid(v.kind==='refund'?'REF':'PAY'),createdAt:new Date().toISOString()};db.payments.push(rec);log(v.kind==='refund'?'استرجاع':'تسجيل دفعة','عملية مالية',rec.id);saveDB();closeModal();render()})}
function openExpense(id=''){let e=id?db.expenses.find(x=>x.id===id):{date:today(),category:'اشتراكات وبرامج',description:'',amount:'',method:'نقدًا'};showModal(id?'تعديل مصروف':'تسجيل مصروف',`<form id="f" class="formgrid">${field('التاريخ','date',e.date,'date',null,true)}${field('التصنيف','category',e.category,'text',['اشتراكات وبرامج','الإنترنت والاتصالات','الإعلانات والتسويق','الطباعة واللوازم','تنقلات','أخرى'],true)}${field('الوصف','description',e.description,'text',null,true,true)}${field('المبلغ (دج)','amount',e.amount,'number',null,true)}${field('طريقة الدفع','method',e.method,'text',['نقدًا','تحويل بنكي','بريدي موب','CCP','أخرى'])}</form>`,'حفظ المصروف',v=>{if(Number(v.amount)<=0)return alert('أدخل مبلغًا أكبر من صفر.');if(id)Object.assign(e,{...v,amount:Number(v.amount),updated:new Date().toISOString()});else{e={...v,id:uid('EXP'),amount:Number(v.amount),createdAt:new Date().toISOString()};db.expenses.push(e)}log(id?'تعديل':'إضافة','مصروف',e.id);saveDB();closeModal();render()})}
function openService(id=''){let s=id?service(id):{name:'',category:'أخرى',price:0,description:'',active:true};showModal(id?'تعديل خدمة':'إضافة خدمة',`<form id="f" class="formgrid">${field('اسم الخدمة','name',s.name,'text',null,true)}${field('التصنيف','category',s.category,'text',['إحصاء','كتابة أكاديمية','تصميم','تنسيق','خدمات متنوعة','أخرى'],true)}${field('السعر التقديري (دج)','price',s.price,'number')}${field('الوصف','description',s.description,'textarea',null,false,true)}</form>`,'حفظ الخدمة',v=>{if(!v.name.trim())return alert('اسم الخدمة مطلوب');if(id)Object.assign(s,{...v,price:Number(v.price||0)});else db.services.push({...v,id:uid('SRV'),price:Number(v.price||0),active:true});log(id?'تعديل':'إضافة','خدمة',id||v.name);saveDB();closeModal();render()})}
function toggleService(id){let s=service(id);s.active=!s.active;saveDB();render()}
function deleteRecord(type,id){let labels={customers:'العميل',orders:'الطلب',payments:'عملية الدفع',expenses:'المصروف'};if(type==='customers'&&db.orders.some(o=>o.customerId===id))return alert('لا يمكن حذف عميل مرتبط بطلبات. يمكنك تعديل بياناته أو الاحتفاظ به للأرشيف.');if(type==='orders'&&db.payments.some(p=>p.orderId===id))return alert('لا يمكن حذف طلب لديه حركات مالية. غيّر حالته إلى ملغى للاحتفاظ بالسجل المالي.');if(!confirm('هل تريد حذف '+labels[type]+'؟ لا يمكن التراجع عن هذا الإجراء.'))return;db[type]=db[type].filter(x=>x.id!==id);log('حذف',labels[type],id);saveDB();render()}
function customerStatement(id){let c=customer(id),os=db.orders.filter(o=>o.customerId===id);showModal('كشف حساب: '+c.name,`<div class="stats">${stat('عدد الطلبات',os.length,'')}${stat('قيمة الطلبات',money(os.filter(o=>o.status!=='ملغى').reduce((a,o)=>a+total(o),0)),'بعد الخصومات')}${stat('صافي المقبوضات',money(db.payments.filter(p=>os.some(o=>o.id===p.orderId)).reduce((a,p)=>a+(p.kind==='refund'?-1:1)* +p.amount,0)),'بعد الاسترجاعات')}${stat('المتبقي',money(os.filter(o=>o.status!=='ملغى').reduce((a,o)=>a+Math.max(0,due(o)),0)),'الرصيد الحالي')}</div>${orderTable(os,false)}`,'إغلاق',()=>closeModal())}
function bindFilters(){let $=id=>document.getElementById(id);if($('orderSearch')){let apply=()=>{let q=$('orderSearch').value.toLowerCase(),st=$('orderStatus').value,sv=$('orderService').value,late=$('lateOnly').checked;let list=db.orders.filter(o=>{let c=customer(o.customerId);return(!q||[o.id,o.title,c?.name,c?.phone].join(' ').toLowerCase().includes(q))&&(!st||o.status===st)&&(!sv||o.serviceId===sv)&&(!late||isLate(o))});$('ordersTable').innerHTML=orderTable(list)};['orderSearch','orderStatus','orderService','lateOnly'].forEach(id=>$(id).addEventListener('input',apply))}
if($('customerSearch'))$('customerSearch').addEventListener('input',()=>{$('customersTable').innerHTML=customerTable(db.customers.filter(c=>[c.name,c.phone,c.major,c.institution].join(' ').toLowerCase().includes($('customerSearch').value.toLowerCase())))});
if($('paymentSearch'))$('paymentSearch').addEventListener('input',()=>{$('paymentsTable').innerHTML=paymentTable(db.payments.filter(p=>[p.id,p.orderId,customer(order(p.orderId)?.customerId)?.name].join(' ').toLowerCase().includes($('paymentSearch').value.toLowerCase())))});
if($('expenseSearch')){let apply=()=>{$('expensesTable').innerHTML=expenseTable(db.expenses.filter(e=>[e.description,e.category].join(' ').toLowerCase().includes($('expenseSearch').value.toLowerCase())&&(!$('expenseMonth').value||e.date.startsWith($('expenseMonth').value))))};$('expenseSearch').addEventListener('input',apply);$('expenseMonth').addEventListener('input',apply)}
if($('calendarMonth'))$('calendarMonth').addEventListener('change',()=>{calendarMonth=$('calendarMonth').value;render()})}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function download(name,content,type){let blob=new Blob(['\ufeff'+content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(type){let rows,filename;if(type==='customers'){filename='SPSS_SBA_customers.csv';rows=[['المعرف','الاسم','الهاتف','حساب اجتماعي','التخصص','المؤسسة','تاريخ أول تعامل','المصدر','ملاحظات'],...db.customers.map(c=>[c.id,c.name,c.phone,c.social,c.major,c.institution,c.firstDate,c.source,c.notes])]}else if(type==='orders'){filename='SPSS_SBA_orders.csv';rows=[['رقم الطلب','العميل','الخدمة','العنوان','تاريخ التسجيل','موعد التسليم','الحالة','السعر','الخصم','المحصّل الصافي','المتبقي','الأولوية','ملاحظات'],...db.orders.map(o=>[o.id,customer(o.customerId)?.name,service(o.serviceId)?.name,o.title,o.created,o.dueDate,o.status,total(o)+Number(o.discount||0),o.discount,paid(o.id),due(o),o.priority,o.notes])]}else if(type==='payments'){filename='SPSS_SBA_payments.csv';rows=[['رقم العملية','رقم الطلب','العميل','النوع','المبلغ','التاريخ','الطريقة','ملاحظات'],...db.payments.map(p=>[p.id,p.orderId,customer(order(p.orderId)?.customerId)?.name,p.kind==='refund'?'استرجاع':'دفعة',p.amount,p.date,p.method,p.notes])]}else if(type==='expenses'){filename='SPSS_SBA_expenses.csv';rows=[['المعرف','التاريخ','التصنيف','الوصف','المبلغ','طريقة الدفع'],...db.expenses.map(e=>[e.id,e.date,e.category,e.description,e.amount,e.method])]}else{filename='SPSS_SBA_services.csv';rows=[['المعرف','الخدمة','التصنيف','السعر','الوصف','مفعلة'],...db.services.map(s=>[s.id,s.name,s.category,s.price,s.description,s.active?'نعم':'لا'])]}download(filename,rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function exportReportCSV(){let from=document.getElementById('reportFrom').value,to=document.getElementById('reportTo').value,sid=document.getElementById('reportService').value;let os=db.orders.filter(o=>o.created?.slice(0,10)>=from&&o.created?.slice(0,10)<=to&&(!sid||o.serviceId===sid));let rows=[['من','إلى','رقم الطلب','العميل','الخدمة','الحالة','قيمة الطلب','المحصّل الصافي','المتبقي'],...os.map(o=>[from,to,o.id,customer(o.customerId)?.name,service(o.serviceId)?.name,o.status,total(o),paid(o.id),due(o)])];download('SPSS_SBA_report.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backupJSON(){download('SPSS_SBA_backup_'+today()+'.json',JSON.stringify({...db,backupAt:new Date().toISOString()},null,2),'application/json')}
function restoreJSON(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||!Array.isArray(d.customers)||!Array.isArray(d.orders)||!Array.isArray(d.payments)||!Array.isArray(d.expenses)||!Array.isArray(d.services))throw Error('البنية غير صحيحة');if(!confirm('ستستبدل النسخة المستوردة كل البيانات الحالية. يُنصح بتنزيل نسخة احتياطية أولًا. متابعة؟'))return;db={...seed,...d};saveDB();render();alert('تمت استعادة البيانات بنجاح.')}catch(e){alert('تعذرت الاستعادة: ملف غير صالح أو غير متوافق.')} };r.readAsText(file);ev.target.value=''}
render();
